name: Checkov IaC Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # nécessaire pour uploader le SARIF

    steps:
      - uses: actions/checkout@v7

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12.3125.0
        with:
          directory: terraform/
          framework: terraform
          # config_file: .checkov.yaml
          output_format: sarif
          output_file_path: checkov-results.sarif
          skip_check: >-
            CKV_AZURE_222,CKV_AZURE_17,CKV_AZURE_136,CKV_AZURE_33,CKV_AZURE_206,
            CKV2_AZURE_40,CKV2_AZURE_41,CKV2_AZURE_47,CKV2_AZURE_1,CKV2_AZURE_31,CKV2_AZURE_38
          soft_fail: false
          compact: true
          quiet: true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Job Summary
        if: always()
        run: |
          {
            echo "## Checkov IaC Scan — Terraform"
            echo ""
            if [ -f checkov-results.sarif ]; then
              echo "📎 Rapport SARIF uploadé dans l'onglet **Security** du repo."
              echo ""
              echo "Résumé par sévérité :"
              echo '```'
              jq -r '.runs[0].results | group_by(.level) | map({level: .[0].level, count: length}) | .[] | "\(.level): \(.count)"' checkov-results.sarif 2>/dev/null || echo "Impossible de parser le SARIF."
              echo '```'
            else
              echo "Aucun rapport SARIF généré."
            fi
          } >> "$GITHUB_STEP_SUMMARY"